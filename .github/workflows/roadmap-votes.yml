name: Publish roadmap vote totals

on:
  issues:
    types: [opened, edited, reopened, closed, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: plainsight-roadmap-votes
  cancel-in-progress: true

jobs:
  publish-votes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test and aggregate public votes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m unittest discover -s tests -v
          python scripts/build_roadmap_votes.py

      - name: Publish vote totals
        run: |
          git config user.name "PlainSight Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/roadmap-votes.json
          if git diff --cached --quiet; then
            echo "No roadmap vote changes to publish."
            exit 0
          fi
          git commit -m "Update public PlainSight roadmap votes"
          git push
