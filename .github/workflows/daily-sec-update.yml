name: Daily SEC update

on:
  schedule:
    - cron: "20 22 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Number of overlap days to recheck"
        required: false
        default: "4"

permissions:
  contents: write

concurrency:
  group: plainsight-data-update
  cancel-in-progress: false

jobs:
  update:
    # Windows runners use a different hosted network pool than the Ubuntu
    # runners that SEC EDGAR repeatedly rejected with HTTP 403 responses.
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SEC_USER_AGENT: "PlainSight/1.0 Mohamed Borhan mohammedborhan0480@gmail.com"
      SEC_REQUEST_INTERVAL_SECONDS: "0.45"
      SEC_MAX_REQUEST_ATTEMPTS: "6"
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test the filing parser
        run: python -m unittest discover -s tests -v

      - name: Collect new public Form 4 filings
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '4' }}
        run: |
          for attempt in 1 2 3; do
            echo "SEC collection attempt $attempt of 3"
            if python scripts/update_sec.py --lookback-days "$LOOKBACK_DAYS"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 120))
              echo "The SEC request was not accepted. Retrying the complete collection in ${delay}s."
              sleep "$delay"
            fi
          done
          exit 1

      - name: Validate the published data
        run: python scripts/validate_data.py

      - name: Publish updated data
        run: |
          git config user.name "PlainSight Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/signals.json data/state.json
          if git diff --cached --quiet; then
            echo "No data changes to publish."
            exit 0
          fi
          git commit -m "Update public SEC filing data $(date -u +%F)"
          git push
